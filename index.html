<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>windowAI</title>
  <style>
    html, body {
      width: 90%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: none;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #chat-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 540px;
      max-height: 700px; /* Increased max height */
      background: rgba(255,255,255,0.7);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      color: brown;
      resize: both;
  overflow: auto;
    min-height: 200px;
  max-width: 1000px;
    }

    #instruction-banner {
      text-align: center;
      font-size: 14px;
      margin-bottom: 5px;
      color: #bbb;
    }

    #response-box {
     font-size: 12px;
  flex-grow: 1;
  max-height: 1000px;
  overflow-y: auto;
  background: rgba(200, 200, 200, 0.25); /* ✅ translucent white */
  color: #111;                           /* ✅ dark text for readability */
  border-radius: 6px;
  padding: 10px;
  line-height: 1.4;
  white-space: pre-wrap;
  font-family: monospace;
  transition: max-height 0.3s ease-in-out;
backdrop-filter: blur(8px);          /* stronger blur */
-webkit-backdrop-filter: blur(8px);

    }
#user-input {
  width: 100%;
  min-height: 40px;
  max-height: 350px;           /* Limit max expansion */
  padding: 8px;
  border: none;
  border-radius: 5px;
  outline: none;
  background: rgba(255,255,255,0.1);
  color: black;
  resize: none;                /* prevent manual resize */
  overflow-y: auto;            /* show scroll if too much text */
  font-family: inherit;
  line-height: 1.4;
}

#resize-handle {
  position: absolute;
  width: 16px;
  height: 16px;
  bottom: 0;
  right: 0;
  cursor: nwse-resize;
  z-index: 10;
  background: transparent;

}



    #submit-button {
      padding: 8px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="chat-container">
  <div id="instruction-banner">Option+Shift+ L: Hide|B: Color|H:highlight</div>
  <pre id="response-box"></pre>
  <div style="display: flex; gap: 5px; margin-top: 5px;">
    <textarea id="user-input" placeholder="Type here..."></textarea>
    <button id="submit-button">Send</button>
  </div>
</div>
<div id="resize-handle"></div>

<script>

   const { ipcRenderer } = require('electron');
   const input = document.getElementById('user-input');
input.addEventListener('input', () => {
  input.style.height = 'auto';                     // reset
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';  // grow but cap
});

   document.getElementById('submit-button').addEventListener('click', () => {
     const userInput = document.getElementById('user-input').value.trim();
     if (userInput) {
       ipcRenderer.send('user-input', userInput);
       document.getElementById('user-input').value = '';
     }
   });

   const responseBox = document.getElementById('response-box');

   ipcRenderer.on('chatgpt-response', (event, response) => {
     responseBox.textContent = response;

     // Adjust height dynamically up to 700px
     let newHeight = Math.min(700, Math.max(200, response.length / 2)) + 'px';
     responseBox.style.maxHeight = newHeight;
       input.style.height = '40px';
   });

let isBlack = false;

ipcRenderer.on('toggle-color', () => {
 const responseBox = document.getElementById('response-box');
 isBlack = !isBlack;

if (isBlack) {
  // Dark Mode (matches LeetCode-like dark theme)
  responseBox.style.background = 'rgba(30, 30, 30, 0.98)';
  responseBox.style.color = '#e0e0e0';
  responseBox.style.textShadow = '0 0 2px rgba(255,255,255,0.05)';
  responseBox.style.border = '1px solid rgba(255,255,255,0.05)';
} else {
  // Light Mode (matches screenshot)
  responseBox.style.background = 'rgba(255, 255, 255, 0.74)';
  responseBox.style.color = '#111';
  responseBox.style.textShadow = '0 0 2px rgba(0,0,0,0.1)';
  responseBox.style.border = '1px solid rgba(0,0,0,0.05)';
}


});
ipcRenderer.on('chatgpt-response', (event, response) => {
  responseBox.textContent = response;

  const lineCount = response.split('\n').length;
  const approxLineHeight = 18; // adjust if needed
  const baseHeight = 150; // input + banner height
  const newHeight = Math.max(4000, baseHeight + lineCount * approxLineHeight); // cap max height

  ipcRenderer.send('adjust-window-height', newHeight); // 🚀 send new height
  input.style.height = '40px';
  // Still adjust internal box
  responseBox.style.maxHeight = (newHeight - baseHeight) + 'px';
});

   const updateBanner = (text) => {
     document.getElementById('instruction-banner').textContent = text;
   };
  window.onload = () => {
  const container = document.getElementById('chat-container');
  const rect = container.getBoundingClientRect();

  const { ipcRenderer } = require('electron');
  ipcRenderer.send('adjust-window-size', {
    width: Math.ceil(rect.width),
    height: Math.ceil(rect.height)
  });
};
  ipcRenderer.on('append-to-input', (event, text) => {
  const input = document.getElementById('user-input');
  input.focus();
  input.value = (input.value + ' ' + text).trim();
});

  const chatContainer = document.getElementById('chat-container');
const resizeHandle = document.getElementById('resize-handle');

resizeHandle.addEventListener('mousedown', (e) => {
  e.preventDefault();
  const startX = e.clientX;
  const startY = e.clientY;
  const startWidth = chatContainer.offsetWidth;
  const startHeight = chatContainer.offsetHeight;

  const onMouseMove = (e) => {
    const newWidth = startWidth + (e.clientX - startX);
    const newHeight = startHeight + (e.clientY - startY);
    chatContainer.style.width = newWidth + 'px';
    chatContainer.style.height = newHeight + 'px';
  };

  const onMouseUp = () => {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
  };

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
});

</script>
</body>
</html>
