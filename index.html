<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>windowAI</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: none;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #chat-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 600px;
      max-height: 900px; /* Increased max height */
      background: rgba(0,0,0,0.7);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      color: white;
    }

    #instruction-banner {
      text-align: center;
      font-size: 14px;
      margin-bottom: 5px;
      color: #bbb;
    }

    #response-box {
      font-size: 12px;
      flex-grow: 1;
      max-height: 1000px; /* Increased max height */
      overflow-y: auto;
      background: rgba(30, 30, 30, 0.8);
      border-radius: 6px;
      padding: 10px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-family: monospace;
      transition: max-height 0.3s ease-in-out;
      background: white;          /* ✅ White background */
      color: black;
    }

    #user-input {
      width: calc(100% - 50px);
      padding: 8px;
      border: none;
      border-radius: 5px;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    #submit-button {
      padding: 8px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="chat-container">
  <div id="instruction-banner">Option+Shift+L: Hide | Option+Shift+B: Color</div>
  <pre id="response-box"></pre>
  <div style="display: flex; gap: 5px; margin-top: 5px;">
    <input type="text" id="user-input" placeholder="Type here..." />
    <button id="submit-button">Send</button>
  </div>
</div>

<script>
    const { ipcRenderer } = require('electron');

    document.getElementById('submit-button').addEventListener('click', () => {
      const userInput = document.getElementById('user-input').value.trim();
      if (userInput) {
        ipcRenderer.send('user-input', userInput);
        document.getElementById('user-input').value = '';
      }
    });

    const responseBox = document.getElementById('response-box');

    ipcRenderer.on('chatgpt-response', (event, response) => {
      responseBox.textContent = response;

      // Adjust height dynamically up to 700px
      let newHeight = Math.min(700, Math.max(200, response.length / 2)) + 'px';
      responseBox.style.maxHeight = newHeight;
    });

let isBlack = false;

ipcRenderer.on('toggle-color', () => {
  const responseBox = document.getElementById('response-box');
  isBlack = !isBlack;

  if (isBlack) {
    responseBox.style.background = 'white'; // Blue
    responseBox.style.color = 'black';
  } else {
    responseBox.style.background = 'black'; // Black
    responseBox.style.color = 'white';
  }
});

    const updateBanner = (text) => {
      document.getElementById('instruction-banner').textContent = text;
    };
</script>
</body>
</html>
